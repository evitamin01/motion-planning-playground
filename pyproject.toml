[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "motion-planning-playground"
dynamic = ["version"]
description = "An interactive playground for exploring, visualizing and comparing 2D motion planning algorithms."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Vitamin" }]
keywords = [
  "motion planning",
  "path planning",
  "robotics",
  "a-star",
  "rrt",
  "prm",
  "visualization",
  "education",
  "benchmark",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "fastapi>=0.110", "pydantic>=2.0", "uvicorn>=0.29"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "matplotlib>=3.7",
]

[project.scripts]
mpplay = "mpplay.cli:main"

[project.urls]
Homepage = "https://github.com/evitamin01/motion-planning-playground"
Documentation = "https://github.com/evitamin01/motion-planning-playground/tree/main/docs"
Issues = "https://github.com/evitamin01/motion-planning-playground/issues"
Changelog = "https://github.com/evitamin01/motion-planning-playground/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/mpplay/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mpplay"]

[tool.hatch.build.targets.sdist]
include = ["src/mpplay", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

# --------------------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "RUF", # ruff-specific rules
  "NPY", # numpy-specific rules
  "PT",  # flake8-pytest-style
]
ignore = ["RUF012"] # ClassVar annotations on planner metadata are deliberate but noisy

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011", "PT018"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
packages = ["mpplay"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["mpplay"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
