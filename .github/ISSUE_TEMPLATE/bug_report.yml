name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        Steps, planner settings and seed. If possible, attach the environment JSON
        (Save environment in the UI) or the output of `mpplay plan --output`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mpplay --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, Python version, and browser if the UI is involved
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
